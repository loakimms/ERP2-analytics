server {
  listen 80;
  server_name _;

  # 메뉴 동기화 ZIP처럼 큰 파일도 /api 프록시를 통해 안정적으로 올릴 수 있게 한다.
  client_max_body_size 2048m;

  root /usr/share/nginx/html;
  index index.html;

  # (중요) 클라이언트(PC) IP 전달을 단순화한다.
  # - UI는 IP를 직접 탐지/입력하지 않고, nginx가 본 IP를 API로 넘긴다.
  # - NAS에 Reverse Proxy(예: Synology)가 앞단에 있는 경우를 대비해 real_ip도 설정한다.
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;

  # Docker 재시작 후 컨테이너 IP가 바뀌어도 502가 나지 않도록 analytics-api를 요청 시점에 재조회한다.
  # (proxy_pass에 호스트명을 직접 쓰면 nginx 시작 시 1회만 조회해 옛 IP를 계속 사용한다.)
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;
  set $analytics_api_upstream analytics-api:8000;

  # Standard health endpoint: keep it before the SPA fallback.
  location = /health {
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-ERP2-CLIENT-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://$analytics_api_upstream/health;
  }

  # API 프록시:
  # - 브라우저는 동일 오리진(5188)으로만 호출하도록 /api 를 사용한다.
  # - 컨테이너 내부 네트워크에서 analytics-api:8000 으로 프록시한다.
  # - rewrite 로 /api/ prefix를 제거한 경로로 전달한다(변수 proxy_pass는 URI 치환을 하지 않음).
  location ^~ /api/ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $http_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
      add_header Access-Control-Max-Age 86400 always;
      add_header Content-Length 0;
      return 204;
    }
    proxy_http_version 1.1;
    # (중요) 수동 수집/광고 리포트 수집은 수분 이상 걸릴 수 있어 프록시 504를 방지한다.
    # - 수집 작업은 API에서 완료 상태를 기록하므로, 프록시는 긴 응답 대기를 허용한다.
    proxy_connect_timeout 10s;
    proxy_send_timeout 1800s;
    proxy_read_timeout 1800s;
    send_timeout 1800s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-ERP2-CLIENT-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$analytics_api_upstream;
  }

  # CDP 실행 스크립트: 실제 파일만 내려가야 함(index.html 폴백 금지)
  location = /Start-Analytics-HostChrome.ps1 {
    add_header Content-Disposition 'attachment; filename="Start-Analytics-HostChrome.ps1"';
    default_type application/octet-stream;
    try_files $uri =404;
  }

  # version.json은 SPA 폴백으로 index.html이 내려가면 안 된다.
  location = /version.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    default_type application/json;
    try_files $uri =404;
  }

  # Chrome DevTools가 앱 메타데이터 확인용으로 자동 요청한다.
  # SPA fallback(index.html)을 JSON 요청에 반환하면 콘솔에 불필요한 에러가 남는다.
  location = /.well-known/appspecific/com.chrome.devtools.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    default_type application/json;
    return 200 '{}';
  }

  # 중요: index.html은 캐시되면 새 배포(번들 해시)로 갱신이 안 되어
  # 화면이 예전 코드로 보일 수 있다. index.html은 항상 재검증/미캐시로 둔다.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    try_files $uri =404;
  }

  # 기타 html도 동일 정책(라우팅 폴백 포함)
  location ~* \.html$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
  }

  # 일부 브라우저/번들 preload 경로가 현재 SPA 라우트 기준으로 해석되면
  # /analytics/.../assets/*.js 형태가 들어올 수 있다. 이를 index.html로 폴백하면
  # module MIME 오류가 발생하므로 실제 /assets/* 파일로만 매핑한다.
  location ~ ^/.+/assets/(.+)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files /assets/$1 =404;
  }

  # SPA 라우팅: /analytics/... 등 클라이언트 라우트는 index.html로 폴백
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 캐시(정적 번들)
  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }
}


